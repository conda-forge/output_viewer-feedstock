{% set name = "output_viewer" %}
{% set version = "1.3.4" %}
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/esgf/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: f4228abd5bf3d1e427cdc873288aedec752ca2ca2a97e8d9dc740e5e6d1a8dbc

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - requests
    - pip
  run:
    - python >={{ python_min }}
    - requests

test:
  requires:
    - python {{ python_min }}
  imports:
    - output_viewer

about:
  home: https://github.com/esgf/output_viewer
  summary: |
    The Output Viewer is designed to provide a framework for viewing arbitrary
    output from diagnostics scripts, metrics, or any program that produces a
    ton of different files that you want to look at it in an easy-to-use
    fashion.
  license: ESGF
  license_file: LICENSE

extra:
  recipe-maintainers:
    - doutriaux1
    - zshaheen
    - xylar
    - chengzhuzhang
    - forsyth2
